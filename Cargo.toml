[package]
name = "plexplayerd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tiny_http = "0.12"
ureq = "2"
serde_json = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde-xml-rs = "0.8"
alsa = "0.12"
symphonia = { version = "0.6", features = ["mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "pcm", "wav"] }
